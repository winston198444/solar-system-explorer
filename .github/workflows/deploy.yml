name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Repo secret (Settings → Secrets → Actions → VITE_API_BASE_URL):
          # URL of the API proxy, e.g. the Cloudflare Worker in proxy/worker.js.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Custom domain (CNAME)
        # GitHub Pages serves the site at the domain configured in
        # Settings → Pages → Custom domain. Writing the file explicitly
        # makes the mapping reliable for Actions deploys.
        run: echo "solarsystem.netmomo.com" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
