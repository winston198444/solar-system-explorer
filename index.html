<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronomia Diaria - NASA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b1a; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #d1d1f7; }
        .card { max-width: 800px; margin: 0 auto; background: #1a1a2e; border-radius: 12px; border: 1px solid #33334d; overflow: hidden; }
        .card img { width: 100%; height: auto; display: block; }
        .content { padding: 25px; }
        .loading { text-align: center; color: #8888aa; padding: 40px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <h1>Imagen Astronómica del Día - NASA</h1>
    <div id="nasa-container" class="card">
        <div class="loading">Cargando datos...</div>
    </div>
    <script>
        async function loadNasaImage() {
            try {
                // Usamos la API de APOD pasando la clave directamente como parámetro de consulta
                const response = await fetch('https://api.nasa.gov/planetary/apod?api_key=a727fc44-4b90-47c6-8b3c-7a129c36b32a');
                if (!response.ok) throw new Error('Error en la red');
                const data = await response.json();
                
                document.getElementById('nasa-container').innerHTML = `
                    <img src="${data.url}" alt="${data.title}">
                    <div class="content">
                        <h2>${data.title}</h2>
                        <p><strong>Fecha:</strong> ${data.date}</p>
                        <p>${data.explanation}</p>
                    </div>
                `;
            } catch (error) {
                document.getElementById('nasa-container').innerHTML = '<div class="loading" style="color: #ff6b6b;">No se pudo cargar la imagen.</div>';
            }
        }
        loadNasaImage();
    </script>
</body>
</html>
