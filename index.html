<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador Espacial - NASA</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0b0b1a; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #d1d1f7;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #33334d;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .content {
            padding: 25px;
        }
        .content h2 {
            margin-top: 0;
            color: #4da6ff;
        }
        .loading {
            text-align: center;
            font-size: 1.2rem;
            color: #8888aa;
            padding: 50px;
        }
    </style>
</head>
<body>

    <h1>Imagen Astronómica del Día - NASA</h1>
    <div id="nasa-container" class="container">
        <div class="loading">Cargando datos de la NASA...</div>
    </div>

    <script>
        async function fetchNasaData() {
            try {
                // Usamos la API pública de la NASA con DEMO_KEY
                const url = 'https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY';
                
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error('network response was not ok');
                }

                const data = await response.json();
                const container = document.getElementById('nasa-container');

                // Renderizamos la información obtenida
                container.innerHTML = `
                    ${data.media_type === 'image' ? `<img src="${data.url}" alt="${data.title}">` : `<iframe src="${data.url}" width="100%" height="450px" frameborder="0"></iframe>`}
                    <div class="content">
                        <h2>${data.title}</h2>
                        <p><strong>Fecha:</strong> ${data.date}</p>
                        <p>${data.explanation}</p>
                    </div>
                `;
            } catch (error) {
                console.error('error loading data', error);
                document.getElementById('nasa-container').innerHTML = '<div class="loading" style="color: #ff6b6b;">No se pudieron cargar los datos de la NASA.</div>';
            }
        }

        fetchNasaData();
    </script>
</body>
</html>
