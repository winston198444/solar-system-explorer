<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo del Sistema Solar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b1a; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #d1d1f7; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1a1a2e; padding: 20px; border-radius: 12px; border: 1px solid #33334d; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { color: #4da6ff; margin-top: 0; border-bottom: 1px solid #33334d; padding-bottom: 8px; }
        .loading { text-align: center; color: #8888aa; grid-column: 1 / -1; padding: 40px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <h1>Catálogo del Sistema Solar</h1>
    <div id="solar-container" class="grid">
        <div class="loading">Cargando planetas...</div>
    </div>

    <script>
        async function fetchPlanets() {
            try {
                // Enrutamos la petición a través de un proxy CORS para evitar el bloqueo del navegador
                const targetUrl = 'https://api.le-systeme-solaire.net/rest/bodies?filter[]=isPlanet,eq,true';
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

                const response = await fetch(proxyUrl, {
                    headers: {
                        'Authorization': 'Bearer a727fc44-4b90-47c6-8b3c-7a129c36b32a'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Error en la respuesta de la red');
                }

                const data = await response.json();
                const container = document.getElementById('solar-container');
                container.innerHTML = '';

                data.bodies.forEach(planet => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${planet.englishName}</h3>
                        <p><strong>Masa:</strong> ${planet.mass ? planet.mass.massValue + ' x 10^' + planet.mass.massExponent + ' kg' : 'N/D'}</p>
                        <p><strong>Gravedad:</strong> ${planet.gravity} m/s²</p>
                        <p><strong>Lunas:</strong> ${planet.moons ? planet.moons.length : 0}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar los datos:', error);
                document.getElementById('solar-container').innerHTML = '<div class="loading" style="color: #ff6b6b;">No se pudieron cargar los datos del sistema solar.</div>';
            }
        }

        fetchPlanets();
    </script>
</body>
</html>
