<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo del Sistema Solar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b1a; color: #fff; padding: 20px; margin: 0; }
        h1 { text-align: center; color: #d1d1f7; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1a1a2e; padding: 20px; border-radius: 12px; border: 1px solid #33334d; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); border-color: #555580; }
        .card h3 { color: #4da6ff; margin-top: 0; border-bottom: 1px solid #33334d; padding-bottom: 8px; }
        .card p { margin: 8px 0; color: #d1d1e0; }
    </style>
</head>
<body>

    <h1>Catálogo del Sistema Solar</h1>
    <div id="solar-container" class="grid"></div>

    <script>
        // Datos completos y reales de los planetas del sistema solar
        const planetsData = [
            { name: "Mercurio", englishName: "Mercury", mass: { value: 3.30, exponent: 23 }, gravity: 3.7, moonsCount: 0, density: 5.43 },
            { name: "Venus", englishName: "Venus", mass: { value: 4.87, exponent: 24 }, gravity: 8.87, moonsCount: 0, density: 5.24 },
            { name: "Tierra", englishName: "Earth", mass: { value: 5.97, exponent: 24 }, gravity: 9.81, moonsCount: 1, density: 5.52 },
            { name: "Marte", englishName: "Mars", mass: { value: 6.42, exponent: 23 }, gravity: 3.71, moonsCount: 2, density: 3.93 },
            { name: "Júpiter", englishName: "Jupiter", mass: { value: 1.89, exponent: 27 }, gravity: 24.79, moonsCount: 95, density: 1.33 },
            { name: "Saturno", englishName: "Saturn", mass: { value: 5.68, exponent: 26 }, gravity: 10.44, moonsCount: 146, density: 0.69 },
            { name: "Urano", englishName: "Uranus", mass: { value: 8.68, exponent: 25 }, gravity: 8.69, moonsCount: 28, density: 1.27 },
            { name: "Neptuno", englishName: "Neptune", mass: { value: 1.02, exponent: 26 }, gravity: 11.15, moonsCount: 16, density: 1.64 }
        ];

        function renderPlanets() {
            const container = document.getElementById('solar-container');
            container.innerHTML = '';

            planetsData.forEach(planet => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${planet.name} <span style="font-size: 0.8rem; color: #8888aa;">(${planet.englishName})</span></h3>
                    <p><strong>Masa:</strong> ${planet.mass.value} × 10<sup>${planet.mass.exponent}</sup> kg</p>
                    <p><strong>Gravedad:</strong> ${planet.gravity} m/s²</p>
                    <p><strong>Densidad:</strong> ${planet.density} g/cm³</p>
                    <p><strong>Lunas conociadas:</strong> ${planet.moonsCount}</p>
                `;
                container.appendChild(card);
            });
        }

        renderPlanets();
    </script>
</body>
</html>
