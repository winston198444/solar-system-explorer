<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo del Sistema Solar</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b1a; color: #fff; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #1a1a2e; padding: 15px; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>

    <h1>Catálogo del Sistema Solar</h1>
    <div id="solar-container" class="grid">loading planet data...</div>

    <script>
        // get planet data using the personal token
        async function fetchPlanets() {
            try {
                const response = await fetch('https://api.le-systeme-solaire.net/rest/bodies?filter[]=isPlanet,eq,true', {
                    headers: {
                        'Authorization': 'Bearer a727fc44-4b90-47c6-8b3c-7a129c36b32a'
                    }
                });
                
                // check if the response failed
                if (!response.ok) {
                    throw new Error('network response was not ok');
                }

                const data = await response.json();
                const container = document.getElementById('solar-container');
                container.innerHTML = '';

                // loop through each planet item
                data.bodies.forEach(planet => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${planet.englishName}</h3>
                        <p><strong>Masa:</strong> ${planet.mass ? planet.mass.massValue + ' x 10^' + planet.mass.massExponent + ' kg' : 'N/D'}</p>
                        <p><strong>Gravedad:</strong> ${planet.gravity} m/s²</p>
                        <p><strong>Lunas:</strong> ${planet.moons ? planet.moons.length : 0}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                // log error and show message on screen
                console.error('error loading data', error);
                document.getElementById('solar-container').innerText = 'no se pudieron cargar los datos espaciales.';
            }
        }

        fetchPlanets();
    </script>
</body>
</html>
