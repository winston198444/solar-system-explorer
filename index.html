<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo del Sistema Solar</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #0b0b1a; 
            color: #fff; 
            padding: 20px; 
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #d1d1f7;
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            max-width: 1200px;
            margin: 0 auto;
        }
        .card { 
            background: #1a1a2e; 
            padding: 20px; 
            border-radius: 12px; 
            border: 1px solid #33334d; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #555580;
        }
        .card h3 {
            margin-top: 0;
            color: #4da6ff;
            border-bottom: 1px solid #33334d;
            padding-bottom: 8px;
        }
        .loading {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.2rem;
            color: #8888aa;
        }
    </style>
</head>
<body>

    <h1>Catálogo del Sistema Solar</h1>
    <div id="solar-container" class="grid">
        <div class="loading">Cargando datos espaciales...</div>
    </div>

    <script>
        // get planet data using proxy and personal token
        async function fetchPlanets() {
            try {
                // Enrutamos la petición a través de un proxy CORS público
                const targetUrl = 'https://api.le-systeme-solaire.net/rest/bodies?filter[]=isPlanet,eq,true';
                const proxyUrl = 'https://proxy.corsproxy.io/?url=' + encodeURIComponent(targetUrl);

                const response = await fetch(proxyUrl, {
                    headers: {
                        'Authorization': 'Bearer a727fc44-4b90-47c6-8b3c-7a129c36b32a'
                    }
                });
                
                // check if the response failed
                if (!response.ok) {
                    throw new Error('network response was not ok');
                }

                const data = await response.json();
                const container = document.getElementById('solar-container');
                container.innerHTML = '';

                // loop through each planet item
                data.bodies.forEach(planet => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${planet.englishName}</h3>
                        <p><strong>Masa:</strong> ${planet.mass ? planet.mass.massValue + ' x 10^' + planet.mass.massExponent + ' kg' : 'N/D'}</p>
                        <p><strong>Gravedad:</strong> ${planet.gravity} m/s²</p>
                        <p><strong>Lunas:</strong> ${planet.moons ? planet.moons.length : 0}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                // log error and show message on screen
                console.error('error loading data', error);
                document.getElementById('solar-container').innerHTML = '<div class="loading" style="color: #ff6b6b;">No se pudieron cargar los datos espaciales.</div>';
            }
        }

        fetchPlanets();
    </script>
</body>
</html>
